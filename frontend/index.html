<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mc-suggests · what to read next</title>
  <meta name="description" content="Name one manhwa, manga or manhua you loved and get a tier list of what to read next." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=20261008b" />
</head>
<body>
  <main class="page">
    <header class="masthead">
      <h1 class="wordmark">mc-suggests</h1>
      <p class="tagline">Name one manhwa you loved. Get a tier list of what to read next.</p>
    </header>

    <form id="searchForm" class="search" autocomplete="off" role="search">
      <div class="input-wrap">
        <input id="query" type="text" placeholder="Solo Leveling, Tower of God, Frieren…" aria-label="A title you enjoyed"
               aria-autocomplete="list" aria-controls="suggestions" />
        <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
      </div>
      <button id="go" type="submit">Rank it</button>
    </form>

    <div class="below-search">
      <p class="picks" id="quickPicks">or try </p>
      <label class="vibe" title="How results are matched">
        <span>match by keywords</span>
        <input id="alpha" type="range" min="0" max="1" step="0.05" value="0.85" aria-label="Match by keywords or by story" />
        <span>by story</span>
      </label>
    </div>

    <p id="status" class="status" aria-live="polite"></p>

    <section id="tiers" class="tiers" hidden></section>
    <section id="detail" class="detail" hidden></section>

    <footer class="footer">
      <span>17,000+ titles from <a href="https://mangadex.org" target="_blank" rel="noopener">MangaDex</a></span>
      <a href="https://github.com/michaelnkema1/mc-suggests" target="_blank" rel="noopener">source</a>
    </footer>
  </main>

  <script>
    window.API_BASE = 'https://mc-suggests.onrender.com';
  </script>
  <script src="app.js?v=20261008b"></script>
</body>
</html>
